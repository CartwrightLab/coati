name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            g++ \
            clang \
            libboost-all-dev \
            libeigen3-dev \
            nlohmann-json3-dev

      - name: Install Meson and Ninja
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson ninja

      - name: Show tool versions
        run: |
          "$CC" --version
          "$CXX" --version
          python --version
          meson --version
          ninja --version

      - name: Configure
        run: |
          meson setup build/debug \
            --buildtype=debug \
            -Dtest=true \
            -Db_coverage=false \
            -Dbenchmark=false

      - name: Build
        run: meson compile -C build/debug --verbose

      - name: Test
        run: meson test -C build/debug --verbose --print-errorlogs

      - name: Preserve Meson logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-${{ matrix.compiler }}
          path: build/debug/meson-logs/
          if-no-files-found: warn
          retention-days: 14
